<g font-size="11" fill="#c7c4bd"><text x="860" y="230">· Selenium 4 / WebDriver</text><text x="860" y="254">· Gauge runner</text><text x="860" y="278">· Assertion + screenshot</text><text x="860" y="302">· Failure → re-discover</text></g>
