<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="auto" font-family="Geist Mono, ui-monospace, monospace">
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0 L0 0 0 20" stroke="#2a2d33" stroke-width="0.5" fill="none" opacity="0.3"></path>
  </pattern>
  <radialGradient id="seaglow" cx="78%" cy="22%" r="55%">
    <stop offset="0%" stop-color="#5cd6c4" stop-opacity="0.10"></stop>
    <stop offset="60%" stop-color="#7aa7ff" stop-opacity="0.04"></stop>
    <stop offset="100%" stop-color="#16181c" stop-opacity="0"></stop>
  </radialGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#5cd6c4"></path>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#8a8f99"></path>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#16181c"></rect>
<rect width="100%" height="100%" fill="url(#grid)"></rect>
<rect width="100%" height="100%" fill="url(#seaglow)"></rect>

  <text x="40" y="44" fill="#8a8f99" font-size="11" letter-spacing="0.2em">ALCYONE · A SELF-HOSTED AI THAT LIVES ON A RASPBERRY PI 5</text>
  <text x="40" y="76" fill="#ece8df" font-size="22" font-family="Fraunces, Georgia, serif">Five collaborating roles. One persistent loop.</text>

  <text x="40" y="130" fill="#8a8f99" font-size="11" letter-spacing="0.1em" text-anchor="start" text-transform="uppercase">inputs</text>
  <g>
    <rect x="40" y="150" width="200" height="64" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="56" y="174" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Telegram</text>
    <text x="56" y="194" fill="#6c707a" font-size="11">in / out · @msbel</text>
  </g>
  <g>
    <rect x="40" y="228" width="200" height="64" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="56" y="252" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">GitHub events</text>
    <text x="56" y="272" fill="#6c707a" font-size="11">webhook · PR / issue</text>
  </g>
  <g>
    <rect x="40" y="306" width="200" height="64" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="56" y="330" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Crontab</text>
    <text x="56" y="350" fill="#6c707a" font-size="11">heartbeat · 60s tick</text>
  </g>

  
  <text x="360" y="130" fill="#8a8f99" font-size="11" letter-spacing="0.1em" text-anchor="start" text-transform="uppercase">crew · five roles</text>
  <g>
    <rect x="340" y="150" width="200" height="90" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="356" y="174" fill="#5cd6c4" font-size="13" font-weight="500" letter-spacing="0.05em">Captain</text>
    <text x="356" y="194" fill="#6c707a" font-size="11">plans, decomposes</text>
  </g>
  <g>
    <rect x="340" y="260" width="200" height="90" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="356" y="284" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Builder</text>
    <text x="356" y="304" fill="#6c707a" font-size="11">writes code, runs tools</text>
  </g>
  <g>
    <rect x="340" y="370" width="200" height="90" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="356" y="394" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Inspector</text>
    <text x="356" y="414" fill="#6c707a" font-size="11">reviews diffs · verdict</text>
  </g>
  <g>
    <rect x="340" y="480" width="200" height="64" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="356" y="504" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Liaison · Archivist</text>
    <text x="356" y="524" fill="#6c707a" font-size="11">speaks · remembers</text>
  </g>

  
  <text x="660" y="130" fill="#8a8f99" font-size="11" letter-spacing="0.1em" text-anchor="start" text-transform="uppercase">routing</text>
  <g>
    <rect x="640" y="150" width="220" height="130" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="656" y="174" fill="#5cd6c4" font-size="13" font-weight="500" letter-spacing="0.05em">Thalamus</text>
    <text x="656" y="194" fill="#6c707a" font-size="11">packet handoff · 3-field ref</text>
  </g>
  <text x="652" y="220" fill="#6c707a" font-size="10">{ packet_id, resolver_key,</text>
  <text x="652" y="234" fill="#6c707a" font-size="10">  inline_vector }</text>
  <text x="652" y="258" fill="#8a8f99" font-size="10">FAISS · Qwen3-0.6B GGUF</text>

  <g>
    <rect x="640" y="300" width="220" height="60" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="656" y="324" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">OpenClaw runtime</text>
    <text x="656" y="344" fill="#6c707a" font-size="11">spawn_guard · MCP</text>
  </g>
  <g>
    <rect x="640" y="380" width="220" height="60" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="656" y="404" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Memory</text>
    <text x="656" y="424" fill="#6c707a" font-size="11">9 atom namespaces</text>
  </g>

  
  <text x="940" y="130" fill="#8a8f99" font-size="11" letter-spacing="0.1em" text-anchor="start" text-transform="uppercase">models</text>
  <g>
    <rect x="920" y="150" width="240" height="80" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="936" y="174" fill="#7aa7ff" font-size="13" font-weight="500" letter-spacing="0.05em">Claude · paid</text>
    <text x="936" y="194" fill="#6c707a" font-size="11">awake on real tasks</text>
  </g>
  <g>
    <rect x="920" y="248" width="240" height="80" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="936" y="272" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Qwen3 · Ollama</text>
    <text x="936" y="292" fill="#6c707a" font-size="11">local heartbeat · CPU</text>
  </g>
  <g>
    <rect x="920" y="346" width="240" height="80" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="936" y="370" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Hailo-10H NPU</text>
    <text x="936" y="390" fill="#6c707a" font-size="11">whisper · CLIP</text>
  </g>

  
  <g>
    <rect x="920" y="460" width="240" height="96" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect>
    <text x="936" y="484" fill="#ece8df" font-size="13" font-weight="500" letter-spacing="0.05em">Raspberry Pi 5 · 4GB</text>
    <text x="936" y="504" fill="#6c707a" font-size="11">systemd · Cloudflare Tunnel</text>
  </g>

  
  <path d="M240 182 L338 195" stroke="#8a8f99" stroke-width="1.25" fill="none" marker-end="url(#arrowMuted)"></path>
  <path d="M240 260 L338 285" stroke="#8a8f99" stroke-width="1.25" fill="none" marker-end="url(#arrowMuted)"></path>
  <path d="M240 338 L338 510" stroke="#8a8f99" stroke-width="1.25" fill="none" marker-end="url(#arrowMuted)"></path>

  
  <path d="M540 195 L640 200" stroke="#5cd6c4" stroke-width="1.25" fill="none" marker-end="url(#arrow)"></path>
  <path d="M540 305 L640 230" stroke="#5cd6c4" stroke-width="1.25" fill="none" marker-end="url(#arrow)"></path>
  <path d="M540 415 L640 250" stroke="#5cd6c4" stroke-width="1.25" fill="none" marker-end="url(#arrow)"></path>
  <path d="M540 510 L640 270" stroke="#5cd6c4" stroke-width="1.25" fill="none" marker-end="url(#arrow)"></path>

  
  <path d="M860 215 L920 190" stroke="#5cd6c4" stroke-width="1.25" fill="none" marker-end="url(#arrow)"></path>
  <path d="M860 230 L920 290" stroke="#5cd6c4" stroke-width="1.25" fill="none" marker-end="url(#arrow)"></path>
  <path d="M860 245 L920 380" stroke="#5cd6c4" stroke-width="1.25" fill="none" marker-end="url(#arrow)"></path>

  
  <path d="M750 360 L750 380" stroke="#5cd6c4" stroke-width="1.25" fill="none" marker-end="url(#arrow)"></path>
  <path d="M750 440 L750 460" stroke="#8a8f99" stroke-width="1.25" fill="none" marker-end="url(#arrowMuted)"></path>

  <text x="40" y="600" fill="#6c707a" font-size="10" letter-spacing="0.15em">5 ROLES · 9 NAMESPACES · 1 PI · 24/7 · TELEGRAM IN / OUT</text>

</svg>