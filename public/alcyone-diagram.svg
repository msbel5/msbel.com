<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Alcyone agent on a Raspberry Pi 5: five collaborating roles around an OpenClaw gateway, with Telegram I/O and a 30-minute heartbeat tick.">
  <defs>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 28px; fill: #ece8df; }
      .label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; fill: #c7c4bd; }
      .hub { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 20px; fill: #ece8df; }
      .small { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; fill: #6c707a; }
      .accent { fill: #7aa7ff; }
      .role-fill { fill: #16181c; stroke: #2a2d33; stroke-width: 1.5; }
      .hub-fill { fill: #16181c; stroke: #7aa7ff; stroke-width: 1.5; }
      .arrow { stroke: #6c707a; stroke-width: 1.5; fill: none; }
      .arrow-accent { stroke: #7aa7ff; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#6c707a"/>
    </marker>
    <marker id="ar-accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#7aa7ff"/>
    </marker>
  </defs>

  <g transform="translate(40, 50)">
    <text class="title">Alcyone</text>
    <text class="small" y="26">five collaborating roles · OpenClaw gateway · Pi 5 · Telegram I/O</text>
  </g>

  <!-- Center hub -->
  <g transform="translate(540, 220)">
    <rect x="-90" y="-44" width="180" height="88" rx="14" class="hub-fill"/>
    <text class="hub" text-anchor="middle" y="-6">OpenClaw</text>
    <text class="label accent" text-anchor="middle" y="22">on Pi 5</text>
  </g>

  <!-- 5 roles around hub (pentagon) -->
  <!-- top: orchestration -->
  <g transform="translate(540, 90)">
    <rect x="-90" y="-26" width="180" height="52" rx="10" class="role-fill"/>
    <text class="label" text-anchor="middle" y="6">orchestration</text>
  </g>
  <line x1="540" y1="116" x2="540" y2="174" class="arrow" marker-end="url(#ar)"/>
  <line x1="540" y1="180" x2="540" y2="120" class="arrow" marker-end="url(#ar)"/>

  <!-- upper-right: building -->
  <g transform="translate(820, 175)">
    <rect x="-80" y="-26" width="160" height="52" rx="10" class="role-fill"/>
    <text class="label" text-anchor="middle" y="6">building</text>
  </g>
  <line x1="744" y1="190" x2="635" y2="215" class="arrow" marker-end="url(#ar)"/>
  <line x1="635" y1="225" x2="744" y2="200" class="arrow" marker-end="url(#ar)"/>

  <!-- lower-right: review -->
  <g transform="translate(820, 305)">
    <rect x="-80" y="-26" width="160" height="52" rx="10" class="role-fill"/>
    <text class="label" text-anchor="middle" y="6">review</text>
  </g>
  <line x1="744" y1="295" x2="635" y2="245" class="arrow" marker-end="url(#ar)"/>
  <line x1="635" y1="255" x2="744" y2="305" class="arrow" marker-end="url(#ar)"/>

  <!-- lower-left: conversation -->
  <g transform="translate(260, 305)">
    <rect x="-80" y="-26" width="160" height="52" rx="10" class="role-fill"/>
    <text class="label" text-anchor="middle" y="6">conversation</text>
  </g>
  <line x1="336" y1="295" x2="445" y2="245" class="arrow" marker-end="url(#ar)"/>
  <line x1="445" y1="255" x2="336" y2="305" class="arrow" marker-end="url(#ar)"/>

  <!-- upper-left: memory -->
  <g transform="translate(260, 175)">
    <rect x="-80" y="-26" width="160" height="52" rx="10" class="role-fill"/>
    <text class="label" text-anchor="middle" y="6">memory</text>
  </g>
  <line x1="336" y1="190" x2="445" y2="215" class="arrow" marker-end="url(#ar)"/>
  <line x1="445" y1="225" x2="336" y2="200" class="arrow" marker-end="url(#ar)"/>

  <!-- Telegram on the far left -->
  <g transform="translate(40, 285)">
    <rect x="0" y="-20" width="120" height="40" rx="8" class="role-fill"/>
    <text class="label accent" text-anchor="middle" x="60" y="6">Telegram</text>
  </g>
  <line x1="160" y1="290" x2="180" y2="305" class="arrow-accent" marker-end="url(#ar-accent)"/>
  <line x1="180" y1="315" x2="160" y2="305" class="arrow-accent" marker-end="url(#ar-accent)"/>

  <!-- Heartbeat tick on memory side -->
  <g transform="translate(40, 175)">
    <rect x="0" y="-20" width="160" height="40" rx="8" class="role-fill"/>
    <text class="label" text-anchor="middle" x="80" y="-3">heartbeat</text>
    <text class="small accent" text-anchor="middle" x="80" y="14">~30 min · local Qwen</text>
  </g>
  <line x1="200" y1="180" x2="180" y2="180" class="arrow" marker-end="url(#ar)"/>

  <!-- bottom note -->
  <g transform="translate(40, 460)">
    <text class="small">paid model when awake on a real task · local Qwen on Ollama between requests · agent reads its own past sessions</text>
  </g>
</svg>
