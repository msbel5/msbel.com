<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Thalamus packet handoff diagram">
  <defs>
    <style>
      .bg { fill: transparent; }
      .label { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 18px; fill: #c7c4bd; }
      .title { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 28px; fill: #ece8df; }
      .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; fill: #8a8f99; }
      .accent { fill: #7aa7ff; }
      .box { fill: #16181c; stroke: #2a2d33; stroke-width: 1.5; rx: 12; }
      .box-accent { fill: #16181c; stroke: #7aa7ff; stroke-width: 1.5; rx: 12; }
      .arrow { fill: none; stroke: #6c707a; stroke-width: 2; }
      .arrow-accent { fill: none; stroke: #7aa7ff; stroke-width: 2; }
      .small { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #6c707a; }
      .key { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #ece8df; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c707a"/>
    </marker>
    <marker id="arrowhead-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa7ff"/>
    </marker>
  </defs>

  <rect width="1200" height="500" class="bg"/>

  <!-- Sender (Captain) -->
  <g transform="translate(40, 180)">
    <rect width="200" height="120" class="box"/>
    <text x="100" y="48" text-anchor="middle" class="title">Captain</text>
    <text x="100" y="78" text-anchor="middle" class="mono">spawns sub-agent</text>
    <text x="100" y="100" text-anchor="middle" class="small">(does NOT paste transcript)</text>
  </g>

  <!-- Packet handoff -->
  <g transform="translate(290, 180)">
    <rect width="280" height="120" class="box-accent"/>
    <text x="140" y="40" text-anchor="middle" class="title accent">Packet</text>
    <text x="20" y="68" class="key">packet_id</text>
    <text x="20" y="90" class="key">resolver_key</text>
    <text x="20" y="112" class="key">inline_vector</text>
  </g>

  <!-- Vector store -->
  <g transform="translate(620, 80)">
    <rect width="240" height="320" class="box"/>
    <text x="120" y="40" text-anchor="middle" class="title">Vector store</text>
    <text x="120" y="65" text-anchor="middle" class="mono">9 namespaces</text>
    <g transform="translate(20, 90)">
      <text class="small" y="0">atoms.code</text>
      <text class="small" y="22">atoms.audit</text>
      <text class="small" y="44">atoms.plan</text>
      <text class="small" y="66">atoms.memory</text>
      <text class="small" y="88">atoms.audio.raw</text>
      <text class="small" y="110">atoms.audio.text</text>
      <text class="small" y="132">atoms.image.raw</text>
      <text class="small" y="154">atoms.image.text</text>
      <text class="small" y="176">atoms.crossmodal</text>
    </g>
    <text x="120" y="290" text-anchor="middle" class="mono accent">Qwen3-0.6B · CPU · llama.cpp</text>
    <text x="120" y="308" text-anchor="middle" class="small">FAISS RaBitQ codebook</text>
  </g>

  <!-- Receiver -->
  <g transform="translate(920, 180)">
    <rect width="240" height="120" class="box"/>
    <text x="120" y="48" text-anchor="middle" class="title">Sub-agent</text>
    <text x="120" y="78" text-anchor="middle" class="mono">resolves only</text>
    <text x="120" y="98" text-anchor="middle" class="mono">relevant atoms</text>
  </g>

  <!-- Arrows -->
  <line x1="240" y1="240" x2="285" y2="240" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="240" x2="615" y2="240" class="arrow-accent" marker-end="url(#arrowhead-accent)"/>
  <line x1="860" y1="240" x2="915" y2="240" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Headline -->
  <g transform="translate(40, 50)">
    <text class="title">Thalamus</text>
    <text class="mono" y="28">3-field reference instead of full transcript paste</text>
  </g>

  <!-- Footer metric -->
  <g transform="translate(40, 450)">
    <text class="small">measured: 19.1% protocol-level token reduction · spawn_context_tokens 68 → 55 · live telemetry on Pi 5</text>
  </g>
</svg>
