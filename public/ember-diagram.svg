<rect width="100%" height="100%" fill="#16181c"></rect><rect width="100%" height="100%" fill="url(#grid)"></rect><rect width="100%" height="100%" fill="url(#seaglow)"></rect><text x="40" y="44" fill="#8a8f99" font-size="11" letter-spacing="0.2em">EMBER · A COLONY-COMMAND RPG, BY HAND, IN UNITY/GODOT</text>
<text x="40" y="76" fill="#ece8df" font-size="22" font-family="Fraunces, Georgia, serif">Godot client. Deterministic Python kernel. Two adapters.</text>
<text x="80" y="130" fill="#8a8f99" font-size="11" letter-spacing="0.1em">player surface</text>
<g><rect x="60" y="150" width="300" height="340" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect><text x="76" y="174" fill="#5cd6c4" font-size="13" font-weight="500">Godot 4.6 client</text><text x="76" y="194" fill="#6c707a" font-size="11">title · creation · gameplay · save/load</text></g>
<g font-size="11" fill="#c7c4bd"><text x="80" y="220">· BackendRuntime autoload</text><text x="80" y="244">· Title screen + character creation</text><text x="80" y="268">· Gameplay shell · top-down</text><text x="80" y="292">· Save/load · semantic desktop</text><text x="80" y="316">· Headless test runner</text></g>
<path d="M360 320 L520 320" stroke="#5cd6c4" stroke-width="1.25" marker-end="url(#arrow)" fill="none"></path>
<text x="370" y="310" fill="#5cd6c4" font-size="10">HTTP/JSON · :8741</text>
<path d="M520 340 L360 340" stroke="#8a8f99" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowMuted)" fill="none"></path>
<text x="560" y="130" fill="#8a8f99" font-size="11" letter-spacing="0.1em">deterministic kernel</text>
<g><rect x="540" y="150" width="300" height="340" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect><text x="556" y="174" fill="#ece8df" font-size="13" font-weight="500">FastAPI backend</text><text x="556" y="194" fill="#6c707a" font-size="11">campaign-first routes · canonical slices</text></g>
<g font-size="11" fill="#c7c4bd"><text x="560" y="220">· actors · effects · jobs</text><text x="560" y="244">· colony pressure · stores</text><text x="560" y="268">· travel · systems closure</text><text x="560" y="292">· deterministic simulation</text><text x="560" y="316">· save/load + projections</text></g>
<line x1="560" y1="360" x2="820" y2="360" stroke="#2a2d33" stroke-width="1"></line>
