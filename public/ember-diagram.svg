<text x="560" y="406" fill="#ece8df" font-size="13">fantasy_ember</text><text x="560" y="426" fill="#6c707a" font-size="10">DF + GemRB synthesis</text>
<text x="560" y="452" fill="#ece8df" font-size="13">scifi_frontier</text><text x="560" y="472" fill="#6c707a" font-size="10">space-age colony</text>
<g><rect x="880" y="150" width="280" height="100" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect><text x="896" y="174" fill="#5cd6c4" font-size="13" font-weight="500">Truth lanes</text><text x="896" y="194" fill="#6c707a" font-size="11">manual godot · pytest · headless · automation</text></g>
<g><rect x="880" y="270" width="280" height="80" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect><text x="896" y="294" fill="#ece8df" font-size="13" font-weight="500">Lessons from v1</text><text x="896" y="314" fill="#6c707a" font-size="11">AI-built RPG passed checks, was unplayable</text></g>
<g><rect x="880" y="370" width="280" height="120" rx="10" fill="#16181c" stroke="#353941" stroke-width="1"></rect><text x="896" y="394" fill="#ece8df" font-size="13" font-weight="500">Now: hand-built</text><text x="896" y="414" fill="#6c707a" font-size="11">system by system · each mechanic earned</text></g>
<text x="894" y="430" fill="#8a8f99" font-size="10">Morrowind in spirit.</text><text x="894" y="446" fill="#8a8f99" font-size="10">RimWorld in scope.</text><text x="894" y="462" fill="#8a8f99" font-size="10">Hand-crafted in Unity.</text>
<text x="40" y="600" fill="#6c707a" font-size="10" letter-spacing="0.15em">FRP-BACKEND · GODOT-CLIENT · DOCS/PRD/ACTIVE · TOOLS</text></svg>