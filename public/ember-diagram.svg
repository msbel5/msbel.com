<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Ember RPG sketch: top-down grid with three NPC pawns from two factions and a faction-relations triangle.">
  <defs>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 28px; fill: #ece8df; }
      .heading { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 18px; fill: #ece8df; }
      .label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #c7c4bd; }
      .small { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; fill: #6c707a; }
      .accent { fill: #7aa7ff; }
      .grid-line { stroke: #2a2d33; stroke-width: 1; }
      .pawn-a { fill: #1f2a3d; stroke: #7aa7ff; stroke-width: 2; }
      .pawn-b { fill: #2a1f1f; stroke: #d18a8a; stroke-width: 2; }
      .pawn-n { fill: #1a1d22; stroke: #c7c4bd; stroke-width: 2; }
      .relation-line { stroke: #6c707a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .faction-fill { fill: #16181c; stroke: #2a2d33; stroke-width: 1.5; }
    </style>
  </defs>

  <g transform="translate(40, 50)">
    <text class="title">Ember</text>
    <text class="small" y="26">an RPG, by hand · top-down · faction simulation in the Dwarf Fortress and RimWorld vein</text>
  </g>

  <!-- Top-down grid (left side) -->
  <g transform="translate(40, 130)">
    <text class="heading">top-down view</text>
    <text class="small" y="22">12×8 tile grid · pixel-art friendly</text>

    <g transform="translate(0, 50)">
      <rect width="600" height="320" rx="12" class="faction-fill"/>
      <!-- vertical grid lines -->
      <line x1="50" y1="0" x2="50" y2="320" class="grid-line"/>
      <line x1="100" y1="0" x2="100" y2="320" class="grid-line"/>
      <line x1="150" y1="0" x2="150" y2="320" class="grid-line"/>
      <line x1="200" y1="0" x2="200" y2="320" class="grid-line"/>
      <line x1="250" y1="0" x2="250" y2="320" class="grid-line"/>
      <line x1="300" y1="0" x2="300" y2="320" class="grid-line"/>
      <line x1="350" y1="0" x2="350" y2="320" class="grid-line"/>
      <line x1="400" y1="0" x2="400" y2="320" class="grid-line"/>
      <line x1="450" y1="0" x2="450" y2="320" class="grid-line"/>
      <line x1="500" y1="0" x2="500" y2="320" class="grid-line"/>
      <line x1="550" y1="0" x2="550" y2="320" class="grid-line"/>
      <!-- horizontal grid lines -->
      <line x1="0" y1="40" x2="600" y2="40" class="grid-line"/>
      <line x1="0" y1="80" x2="600" y2="80" class="grid-line"/>
      <line x1="0" y1="120" x2="600" y2="120" class="grid-line"/>
      <line x1="0" y1="160" x2="600" y2="160" class="grid-line"/>
      <line x1="0" y1="200" x2="600" y2="200" class="grid-line"/>
      <line x1="0" y1="240" x2="600" y2="240" class="grid-line"/>
      <line x1="0" y1="280" x2="600" y2="280" class="grid-line"/>

      <!-- Faction A pawn -->
      <circle cx="125" cy="100" r="14" class="pawn-a"/>
      <text class="small accent" text-anchor="middle" x="125" y="135">A</text>
      <!-- Faction B pawn -->
      <circle cx="425" cy="220" r="14" class="pawn-b"/>
      <text class="small" text-anchor="middle" x="425" y="255" fill="#d18a8a">B</text>
      <!-- Neutral pawn -->
      <circle cx="275" cy="160" r="14" class="pawn-n"/>
      <text class="small" text-anchor="middle" x="275" y="195">N</text>
    </g>
  </g>

  <!-- Faction relations triangle (right side) -->
  <g transform="translate(720, 130)">
    <text class="heading">faction relations</text>
    <text class="small" y="22">edges = trust · weight changes per event</text>

    <g transform="translate(0, 60)">
      <!-- Triangle vertices -->
      <!-- A top -->
      <circle cx="180" cy="40" r="22" class="pawn-a"/>
      <text class="label accent" text-anchor="middle" x="180" y="44">A</text>
      <!-- B bottom-left -->
      <circle cx="50" cy="240" r="22" class="pawn-b"/>
      <text class="label" text-anchor="middle" x="50" y="245" fill="#d18a8a">B</text>
      <!-- N bottom-right -->
      <circle cx="310" cy="240" r="22" class="pawn-n"/>
      <text class="label" text-anchor="middle" x="310" y="244">N</text>

      <!-- Edges -->
      <line x1="160" y1="58" x2="70" y2="220" class="relation-line"/>
      <line x1="200" y1="58" x2="290" y2="220" class="relation-line"/>
      <line x1="74" y1="240" x2="286" y2="240" class="relation-line"/>

      <text class="small" text-anchor="middle" x="105" y="155">hostile</text>
      <text class="small" text-anchor="middle" x="255" y="155">curious</text>
      <text class="small" text-anchor="middle" x="180" y="265">neutral</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 500)">
    <text class="small">first prototype was AI-scaffolded and unplayable · this one is built by hand, system by system</text>
  </g>
</svg>
