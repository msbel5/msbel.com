<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Career timeline 2010 to 2026: mechanical engineering 2010-2018, telecom QA at scale 2018-2023, AI agent infrastructure and side projects 2023 to present.">
  <defs>
    <style>
      .heading { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 22px; fill: #ece8df; }
      .label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; fill: #c7c4bd; }
      .small { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; fill: #6c707a; }
      .accent { fill: #7aa7ff; }
      .axis { stroke: #2a2d33; stroke-width: 1.5; }
      .seg { stroke-width: 4; fill: none; }
      .seg-a { stroke: #6c707a; }
      .seg-b { stroke: #c7c4bd; }
      .seg-c { stroke: #7aa7ff; }
      .node { fill: #16181c; stroke: #2a2d33; stroke-width: 1.5; }
      .node-accent { fill: #16181c; stroke: #7aa7ff; stroke-width: 1.5; }
      .icon { fill: none; stroke: #c7c4bd; stroke-width: 1.5; }
      .icon-accent { fill: none; stroke: #7aa7ff; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Heading -->
  <g transform="translate(40, 36)">
    <text class="heading">Career timeline</text>
    <text class="small" y="22">2010 to present · three phases · same thread underneath</text>
  </g>

  <!-- Axis -->
  <line x1="80" y1="140" x2="1140" y2="140" class="axis"/>

  <!-- Year labels -->
  <g transform="translate(0, 200)" font-family="Geist Mono">
    <text class="small" text-anchor="middle" x="80">2010</text>
    <text class="small" text-anchor="middle" x="450">2018</text>
    <text class="small" text-anchor="middle" x="785">2023</text>
    <text class="small" text-anchor="middle" x="1140">now</text>
  </g>

  <!-- Phase 1: 2010 - 2018 mechanical engineering -->
  <line x1="80" y1="140" x2="450" y2="140" class="seg seg-a"/>
  <g transform="translate(80, 140)">
    <circle r="12" class="node"/>
    <!-- gear icon mini -->
    <g transform="scale(0.55)">
      <circle r="10" class="icon"/>
      <line x1="0" y1="-14" x2="0" y2="-10" class="icon"/>
      <line x1="0" y1="14" x2="0" y2="10" class="icon"/>
      <line x1="-14" y1="0" x2="-10" y2="0" class="icon"/>
      <line x1="14" y1="0" x2="10" y2="0" class="icon"/>
    </g>
  </g>
  <g transform="translate(80, 90)">
    <text class="label">phase one</text>
    <text class="small" y="18">mechanical engineering</text>
    <text class="small" y="34">Istanbul University, B.Sc.</text>
  </g>

  <!-- Phase 2: 2018 - 2023 telecom QA -->
  <line x1="450" y1="140" x2="785" y2="140" class="seg seg-b"/>
  <g transform="translate(450, 140)">
    <circle r="12" class="node"/>
    <!-- circuit mini -->
    <g transform="scale(0.5)">
      <rect x="-12" y="-6" width="24" height="12" class="icon"/>
      <line x1="-16" y1="0" x2="-12" y2="0" class="icon"/>
      <line x1="12" y1="0" x2="16" y2="0" class="icon"/>
    </g>
  </g>
  <g transform="translate(450, 90)">
    <text class="label">phase two</text>
    <text class="small" y="18">telecom QA at scale</text>
    <text class="small" y="34">five years on telecom-grade systems</text>
  </g>

  <!-- Phase 3: 2023 - present AI infra -->
  <line x1="785" y1="140" x2="1140" y2="140" class="seg seg-c"/>
  <g transform="translate(785, 140)">
    <circle r="12" class="node-accent"/>
    <!-- star mini -->
    <text class="accent" text-anchor="middle" y="5" font-family="Geist Mono" font-size="14">★</text>
  </g>
  <g transform="translate(785, 90)">
    <text class="label accent">phase three</text>
    <text class="small" y="18">AI agent infra · side projects</text>
    <text class="small" y="34">Alcyone · Thalamus · Trading bot · QA agent · Ember</text>
  </g>

  <!-- terminal node -->
  <circle cx="1140" cy="140" r="6" fill="#7aa7ff"/>
</svg>
