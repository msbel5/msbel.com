<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Career timeline 2010 to present: mechanical engineering, telecom QA at scale, AI agent infrastructure and side projects.">
  <defs>
    <radialGradient id="ct-glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5cd6c4" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#7aa7ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0d0e10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="#0d0e10"/>
  <rect width="1200" height="280" fill="url(#ct-glow)"/>

  <!-- Heading -->
  <g font-family="Geist Mono, ui-monospace, monospace">
    <text x="60" y="42" font-family="msbel Hybrid, Fraunces, Georgia, serif" font-size="22" fill="#ece8df">Career timeline</text>
    <text x="60" y="64" font-size="12" fill="#8a8f99">2010 to present · three phases · same thread underneath</text>
  </g>

  <!-- Axis -->
  <line x1="120" y1="170" x2="1080" y2="170" stroke="#2a2d33" stroke-width="1.5"/>

  <!-- Year ticks below axis -->
  <g font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#8a8f99">
    <text x="120"  y="200" text-anchor="middle">2010</text>
    <text x="500"  y="200" text-anchor="middle">2018</text>
    <text x="820"  y="200" text-anchor="middle">2023</text>
    <text x="1080" y="200" text-anchor="middle">now</text>
  </g>

  <!-- Phase 1 segment + node + label group (positioned BELOW the axis to avoid overlap) -->
  <line x1="120" y1="170" x2="500" y2="170" stroke="#6c707a" stroke-width="4"/>
  <circle cx="120" cy="170" r="11" fill="#16181c" stroke="#2a2d33" stroke-width="1.5"/>
  <g transform="translate(120,90)" font-family="Geist Mono, ui-monospace, monospace">
    <text font-size="13" fill="#c7c4bd">phase one</text>
    <text y="20" font-size="12" fill="#8a8f99">mechanical engineering</text>
    <text y="38" font-size="12" fill="#6c707a">Istanbul University, B.Sc.</text>
  </g>

  <!-- Phase 2 -->
  <line x1="500" y1="170" x2="820" y2="170" stroke="#c7c4bd" stroke-width="4" opacity="0.55"/>
  <circle cx="500" cy="170" r="11" fill="#16181c" stroke="#2a2d33" stroke-width="1.5"/>
  <g transform="translate(500,90)" font-family="Geist Mono, ui-monospace, monospace">
    <text font-size="13" fill="#c7c4bd">phase two</text>
    <text y="20" font-size="12" fill="#8a8f99">telecom QA at scale</text>
    <text y="38" font-size="12" fill="#6c707a">five years on telecom-grade systems</text>
  </g>

  <!-- Phase 3 -->
  <line x1="820" y1="170" x2="1080" y2="170" stroke="#7aa7ff" stroke-width="4"/>
  <circle cx="820" cy="170" r="12" fill="#16181c" stroke="#7aa7ff" stroke-width="1.5"/>
  <text x="820" y="174" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#7aa7ff">★</text>
  <g transform="translate(820,90)" font-family="Geist Mono, ui-monospace, monospace">
    <text font-size="13" fill="#7aa7ff">phase three</text>
    <text y="20" font-size="12" fill="#c7c4bd">AI agent infra · side projects</text>
    <text y="38" font-size="12" fill="#8a8f99">Alcyone · Thalamus · Trading bot · QA · Ember</text>
  </g>

  <!-- terminal cap -->
  <circle cx="1080" cy="170" r="6" fill="#5cd6c4"/>
</svg>
