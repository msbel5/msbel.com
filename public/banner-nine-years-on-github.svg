<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nine years on GitHub — yearly commit-density tick marks 2017 through 2026.">
  <defs>
    <radialGradient id="ny-glow" cx="78%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5cd6c4" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#7aa7ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0d0e10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#0d0e10"/>
  <rect width="1200" height="320" fill="url(#ny-glow)"/>

  <!-- Title block (full-width left) -->
  <g font-family="Geist Mono, ui-monospace, monospace">
    <text x="56" y="80" font-size="13" fill="#8a8f99" letter-spacing="2">2026.04.28 · WRITING</text>
    <text x="56" y="142" font-family="msbel Hybrid, Fraunces, Georgia, serif" font-weight="400" font-size="44" fill="#ece8df" letter-spacing="-1">Nine years on GitHub, in one afternoon</text>
    <text x="56" y="180" font-size="13" fill="#8a8f99" letter-spacing="0.4">42 repos · public and private · going back to 2017</text>
  </g>

  <!-- Year axis spans full width below title -->
  <g transform="translate(56,260)" font-family="Geist Mono, ui-monospace, monospace">
    <!-- baseline -->
    <line x1="0" y1="0" x2="1088" y2="0" stroke="#2a2d33" stroke-width="1"/>

    <!-- 2017: burst -->
    <g transform="translate(50,0)">
      <line x1="-9" y1="-2" x2="-9" y2="-30" stroke="#7aa7ff" stroke-width="2"/>
      <line x1="-3" y1="-2" x2="-3" y2="-58" stroke="#7aa7ff" stroke-width="2"/>
      <line x1="3"  y1="-2" x2="3"  y2="-44" stroke="#7aa7ff" stroke-width="2"/>
      <line x1="9"  y1="-2" x2="9"  y2="-22" stroke="#7aa7ff" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#ece8df">2017</text>
    </g>
    <!-- 2018 -->
    <g transform="translate(170,0)">
      <line x1="0" y1="-2" x2="0" y2="-12" stroke="#6c707a" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#8a8f99">'18</text>
    </g>
    <!-- 2019: MvE -->
    <g transform="translate(290,0)">
      <line x1="-3" y1="-2" x2="-3" y2="-18" stroke="#6c707a" stroke-width="2"/>
      <line x1="3"  y1="-2" x2="3"  y2="-10" stroke="#6c707a" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#8a8f99">'19</text>
    </g>
    <!-- 2020 -->
    <g transform="translate(410,0)">
      <line x1="0" y1="-2" x2="0" y2="-8" stroke="#6c707a" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#8a8f99">'20</text>
    </g>
    <!-- 2021 -->
    <g transform="translate(530,0)">
      <line x1="0" y1="-2" x2="0" y2="-14" stroke="#6c707a" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#8a8f99">'21</text>
    </g>
    <!-- 2022 -->
    <g transform="translate(650,0)">
      <line x1="-3" y1="-2" x2="-3" y2="-20" stroke="#6c707a" stroke-width="2"/>
      <line x1="3"  y1="-2" x2="3"  y2="-12" stroke="#6c707a" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#8a8f99">'22</text>
    </g>
    <!-- 2023: QA flood -->
    <g transform="translate(770,0)">
      <line x1="-9" y1="-2" x2="-9" y2="-26" stroke="#7aa7ff" stroke-width="2"/>
      <line x1="-3" y1="-2" x2="-3" y2="-46" stroke="#7aa7ff" stroke-width="2"/>
      <line x1="3"  y1="-2" x2="3"  y2="-72" stroke="#7aa7ff" stroke-width="2"/>
      <line x1="9"  y1="-2" x2="9"  y2="-38" stroke="#7aa7ff" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#ece8df">2023</text>
    </g>
    <!-- 2024: dAIlog -->
    <g transform="translate(890,0)">
      <line x1="-3" y1="-2" x2="-3" y2="-32" stroke="#5cd6c4" stroke-width="2"/>
      <line x1="3"  y1="-2" x2="3"  y2="-22" stroke="#5cd6c4" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#8a8f99">'24</text>
    </g>
    <!-- 2025 -->
    <g transform="translate(990,0)">
      <line x1="0" y1="-2" x2="0" y2="-22" stroke="#6c707a" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#8a8f99">'25</text>
    </g>
    <!-- 2026: fleet -->
    <g transform="translate(1080,0)">
      <line x1="-6" y1="-2" x2="-6" y2="-42" stroke="#5cd6c4" stroke-width="2"/>
      <line x1="0"  y1="-2" x2="0"  y2="-58" stroke="#5cd6c4" stroke-width="2"/>
      <line x1="6"  y1="-2" x2="6"  y2="-32" stroke="#5cd6c4" stroke-width="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="12" fill="#ece8df">2026</text>
    </g>
  </g>
</svg>
