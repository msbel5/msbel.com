<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Launching the fleet: five stacked rectangles labeled Alcyone, Thalamus, Trading bot, QA Automation, Ember.">
  <defs>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 44px; fill: #ece8df; }
      .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; fill: #6c707a; letter-spacing: 0.06em; }
      .label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #ece8df; }
      .box { fill: #16181c; stroke: #2a2d33; stroke-width: 1.5; }
      .box-accent { fill: #16181c; stroke: #7aa7ff; stroke-width: 1.5; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#16181c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>

  <g transform="translate(56, 100)">
    <text class="sub">2026.04.27 · WRITING</text>
    <text class="title" y="58">Launching the fleet</text>
    <text class="sub" y="120">a Pi 5 in Istanbul, five things on the bench</text>
  </g>

  <!-- Five stacked rectangles aligned right -->
  <g transform="translate(740, 50)" font-family="Geist Mono">
    <rect x="0" y="0" width="380" height="34" rx="6" class="box-accent"/>
    <text class="label" x="14" y="22">Alcyone</text>
    <text class="sub" x="240" y="22">self-hosted AI · Pi 5</text>

    <rect x="0" y="44" width="380" height="34" rx="6" class="box-accent"/>
    <text class="label" x="14" y="66">Thalamus</text>
    <text class="sub" x="208" y="66">OpenClaw plugin · MIT · npm</text>

    <rect x="0" y="88" width="380" height="34" rx="6" class="box"/>
    <text class="label" x="14" y="110">Trading bot</text>
    <text class="sub" x="220" y="110">9 layers · Binance Testnet</text>

    <rect x="0" y="132" width="380" height="34" rx="6" class="box"/>
    <text class="label" x="14" y="154">QA Automation</text>
    <text class="sub" x="220" y="154">Selenium · Gauge · Java</text>

    <rect x="0" y="176" width="380" height="34" rx="6" class="box"/>
    <text class="label" x="14" y="198">Ember</text>
    <text class="sub" x="240" y="198">an RPG, by hand · Unity</text>
  </g>
</svg>
