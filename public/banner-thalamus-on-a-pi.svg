<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Thalamus on a Pi — packet handoff layer for multi-agent crews.">
  <defs>
    <radialGradient id="th-glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5cd6c4" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#7aa7ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0d0e10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#0d0e10"/>
  <rect width="1200" height="320" fill="url(#th-glow)"/>

  <!-- Star-map dots (decorative) -->
  <g fill="#2a2d33">
    <circle cx="36" cy="44" r="1.1"/>
    <circle cx="92" cy="36" r="0.8"/>
    <circle cx="120" cy="84" r="1.3"/>
    <circle cx="58" cy="180" r="0.8"/>
    <circle cx="44" cy="240" r="1"/>
    <circle cx="116" cy="244" r="0.6"/>
  </g>
  <g fill="#7aa7ff" opacity="0.55">
    <circle cx="76" cy="124" r="1.4"/>
    <circle cx="98" cy="200" r="1.1"/>
  </g>

  <!-- Title block -->
  <g font-family="Geist Mono, ui-monospace, monospace">
    <text x="56" y="92" font-size="13" fill="#8a8f99" letter-spacing="2">2026.05.06 · WRITING</text>
    <text x="56" y="156" font-family="msbel Hybrid, Fraunces, Georgia, serif" font-weight="400" font-size="42" fill="#ece8df" letter-spacing="-1">Thalamus on a Pi</text>
    <text x="56" y="194" font-size="13" fill="#8a8f99" letter-spacing="0.4">packet handoff for multi-agent crews · OpenClaw plugin</text>
  </g>

  <!-- Right column: 3-field packet representation -->
  <g transform="translate(740,80)" font-family="Geist Mono, ui-monospace, monospace">
    <rect width="380" height="160" rx="10" fill="#16181c" stroke="#2a2d33" stroke-width="1.5"/>

    <!-- packet header -->
    <text x="20" y="32" font-size="11" fill="#8a8f99" letter-spacing="2">PACKET</text>

    <!-- 3 fields -->
    <g transform="translate(20,50)">
      <rect width="340" height="28" rx="6" fill="#0d0e10" stroke="#7aa7ff" stroke-width="1.2"/>
      <text x="14" y="18" font-size="12" fill="#7aa7ff">packet_id</text>
      <text x="330" y="18" text-anchor="end" font-size="11" fill="#8a8f99">pkt_2026...e7</text>
    </g>
    <g transform="translate(20,86)">
      <rect width="340" height="28" rx="6" fill="#0d0e10" stroke="#5cd6c4" stroke-width="1.2"/>
      <text x="14" y="18" font-size="12" fill="#5cd6c4">resolver_key</text>
      <text x="330" y="18" text-anchor="end" font-size="11" fill="#8a8f99">sha256:c1d2...</text>
    </g>
    <g transform="translate(20,122)">
      <rect width="340" height="28" rx="6" fill="#0d0e10" stroke="#5cd6c4" stroke-width="1.2"/>
      <text x="14" y="18" font-size="12" fill="#5cd6c4">inline_vector</text>
      <text x="330" y="18" text-anchor="end" font-size="11" fill="#8a8f99">[1024d, BBQ 128B]</text>
    </g>
  </g>

  <!-- footer line -->
  <text x="56" y="280" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#6c707a" letter-spacing="0.15em">CLAWHUB · NPM · MIT · QWEN3-EMBEDDING-0.6B · FAISS RABITQ</text>
</svg>
