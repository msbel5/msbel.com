<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="The tesseract demo — a 4D hypercube projected into 3D, lines on a dark background.">
  <defs>
    <radialGradient id="tess-glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5cd6c4" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#7aa7ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0d0e10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#0d0e10"/>
  <rect width="1200" height="320" fill="url(#tess-glow)"/>

  <!-- Title block -->
  <g font-family="Geist Mono, ui-monospace, monospace">
    <text x="56" y="100" font-size="13" fill="#8a8f99" letter-spacing="2">2026.04.28 · WRITING</text>
    <text x="56" y="158" font-family="msbel Hybrid, Fraunces, Georgia, serif" font-weight="400" font-size="44" fill="#ece8df" letter-spacing="-1">The tesseract demo</text>
    <text x="56" y="194" font-size="13" fill="#8a8f99" letter-spacing="0.4">january 2024 · seven agents · one prompt · matplotlib at the end</text>
  </g>

  <!-- Tesseract on the right: outer cube + inner cube + diagonals -->
  <g transform="translate(960,160)" fill="none">
    <!-- back ghost cube (faint) -->
    <rect x="-90" y="-90" width="180" height="180" stroke="#6c707a" stroke-width="1" opacity="0.55"/>
    <line x1="-90" y1="-90" x2="-30" y2="-30" stroke="#6c707a" stroke-width="1" opacity="0.55"/>
    <line x1="90"  y1="-90" x2="30"  y2="-30" stroke="#6c707a" stroke-width="1" opacity="0.55"/>
    <line x1="-90" y1="90"  x2="-30" y2="30"  stroke="#6c707a" stroke-width="1" opacity="0.55"/>
    <line x1="90"  y1="90"  x2="30"  y2="30"  stroke="#6c707a" stroke-width="1" opacity="0.55"/>

    <!-- outer cube -->
    <rect x="-120" y="-120" width="240" height="240" stroke="#7aa7ff" stroke-width="1.6" opacity="0.95"/>
    <!-- inner cube -->
    <rect x="-60" y="-60" width="120" height="120" stroke="#7aa7ff" stroke-width="1.6" opacity="0.95"/>
    <!-- diagonals connecting them -->
    <line x1="-120" y1="-120" x2="-60" y2="-60" stroke="#7aa7ff" stroke-width="1.6"/>
    <line x1="120"  y1="-120" x2="60"  y2="-60" stroke="#7aa7ff" stroke-width="1.6"/>
    <line x1="-120" y1="120"  x2="-60" y2="60"  stroke="#7aa7ff" stroke-width="1.6"/>
    <line x1="120"  y1="120"  x2="60"  y2="60"  stroke="#7aa7ff" stroke-width="1.6"/>

    <!-- vertex dots -->
    <circle cx="-120" cy="-120" r="2.5" fill="#5cd6c4"/>
    <circle cx="120"  cy="-120" r="2.5" fill="#5cd6c4"/>
    <circle cx="-120" cy="120"  r="2.5" fill="#5cd6c4"/>
    <circle cx="120"  cy="120"  r="2.5" fill="#5cd6c4"/>
    <circle cx="-60"  cy="-60"  r="2"   fill="#5cd6c4"/>
    <circle cx="60"   cy="-60"  r="2"   fill="#5cd6c4"/>
    <circle cx="-60"  cy="60"   r="2"   fill="#5cd6c4"/>
    <circle cx="60"   cy="60"   r="2"   fill="#5cd6c4"/>
  </g>
</svg>
