<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="The tesseract demo: a 4D hypercube projected into 3D, lines on a dark background.">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e10"></stop>
      <stop offset="100%" stop-color="#16181c"></stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"></rect>

  <g transform="translate(56, 100)">
    <text class="sub">2026.04.28 · WRITING</text>
    <text class="title" y="58">The tesseract demo</text>
    <text class="sub" y="120">january 2024 · seven agents · one prompt · matplotlib at the end</text>
  </g>

  
  <g transform="translate(960, 160)">
    
    <rect x="-120" y="-120" width="240" height="240" class="stroke"></rect>
    
    <rect x="-60" y="-60" width="120" height="120" class="stroke"></rect>
    
    <line x1="-120" y1="-120" x2="-60" y2="-60" class="stroke"></line>
    <line x1="120" y1="-120" x2="60" y2="-60" class="stroke"></line>
    <line x1="-120" y1="120" x2="-60" y2="60" class="stroke"></line>
    <line x1="120" y1="120" x2="60" y2="60" class="stroke"></line>
    
    <rect x="-90" y="-90" width="180" height="180" class="stroke-faint"></rect>
    <line x1="-90" y1="-90" x2="-30" y2="-30" class="stroke-faint"></line>
    <line x1="90" y1="-90" x2="30" y2="-30" class="stroke-faint"></line>
    <line x1="-90" y1="90" x2="-30" y2="30" class="stroke-faint"></line>
    <line x1="90" y1="90" x2="30" y2="30" class="stroke-faint"></line>
  </g>
</svg>