<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="The tesseract demo: a 4D hypercube projected into 3D, lines on a dark background.">
  <defs>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 44px; fill: #ece8df; }
      .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; fill: #6c707a; letter-spacing: 0.06em; }
      .stroke { stroke: #7aa7ff; stroke-width: 1.5; fill: none; opacity: 0.85; }
      .stroke-faint { stroke: #6c707a; stroke-width: 1; fill: none; opacity: 0.55; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e10"/>
      <stop offset="100%" stop-color="#16181c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>

  <g transform="translate(56, 100)">
    <text class="sub">2026.04.28 · WRITING</text>
    <text class="title" y="58">The tesseract demo</text>
    <text class="sub" y="120">january 2024 · seven agents · one prompt · matplotlib at the end</text>
  </g>

  <!-- Tesseract: outer cube + inner cube + diagonals -->
  <g transform="translate(960, 160)">
    <!-- outer cube (large) -->
    <rect x="-120" y="-120" width="240" height="240" class="stroke"/>
    <!-- inner cube (small) -->
    <rect x="-60" y="-60" width="120" height="120" class="stroke"/>
    <!-- diagonals -->
    <line x1="-120" y1="-120" x2="-60" y2="-60" class="stroke"/>
    <line x1="120" y1="-120" x2="60" y2="-60" class="stroke"/>
    <line x1="-120" y1="120" x2="-60" y2="60" class="stroke"/>
    <line x1="120" y1="120" x2="60" y2="60" class="stroke"/>
    <!-- extra projection ghosts -->
    <rect x="-90" y="-90" width="180" height="180" class="stroke-faint"/>
    <line x1="-90" y1="-90" x2="-30" y2="-30" class="stroke-faint"/>
    <line x1="90" y1="-90" x2="30" y2="-30" class="stroke-faint"/>
    <line x1="-90" y1="90" x2="-30" y2="30" class="stroke-faint"/>
    <line x1="90" y1="90" x2="30" y2="30" class="stroke-faint"/>
  </g>
</svg>
